name: Sync Figma Tokens

on:
  # Run on a schedule (every day at 06:00 UTC)
  schedule:
    - cron: '0 6 * * *'

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

  # Optionally trigger on pushes to main (remove if not needed)
  # push:
  #   branches: [main]

jobs:
  sync:
    name: Fetch → Transform → Build → Commit
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Required to push the updated tokens back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        run: |
          if [ -z "$FIGMA_TOKEN" ]; then
            echo "::error::Repository secret FIGMA_TOKEN is not set."
            exit 1
          fi
          if [ -z "$FIGMA_FILE_KEY" ]; then
            echo "::error::Repository secret FIGMA_FILE_KEY is not set."
            exit 1
          fi
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}

      - name: Fetch Figma variables
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: npm run fetch

      - name: Transform to DTCG format
        run: npm run transform

      - name: Build token outputs
        run: npm run build

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet tokens/ build/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated tokens
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tokens/ build/
          git commit -m "chore: sync design tokens from Figma [skip ci]"
          git push

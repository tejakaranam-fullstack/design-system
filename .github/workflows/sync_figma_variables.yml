name: Sync Figma Variables
 
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
 
permissions:
  contents: write
 
jobs:
  sync:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 18
 
      - run: npm install axios fs-extra
 
      - run: node scripts/fetch-figma-variables.js
        env:
          FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}
          FIGMA_FILE_ID: ${{ secrets.FIGMA_FILE_ID }}
 
      - run: |
          git config user.name "figma-bot"
          git config user.email "figma-bot@users.noreply.github.com"
 
          git add tokens/
          git commit -m "update figma tokens" || echo "No changes"
          git push
 
// scripts/fetch-figma-variables.js
 
const axios = require("axios");
const fs = require("fs-extra");
 
const FIGMA_API_TOKEN = process.env.FIGMA_API_TOKEN;
const FIGMA_FILE_ID = process.env.FIGMA_FILE_ID;
 
const headers = {
  "X-Figma-Token": FIGMA_API_TOKEN,
};
 
const OUTPUT_DIR = "tokens";
 
function sanitize(name) {
  return name
    .toLowerCase()
    .replace(/[^a-z0-9]/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}
 
async function fetchVariables() {
  const res = await axios.get(
    `https://api.figma.com/v1/files/${FIGMA_FILE_ID}/variables/local`,
    { headers }
  );
  return res.data;
}
 
function groupByCollection(data) {
  const collections = data.meta.variableCollections;
  const variables = data.meta.variables;
 
  const output = {};
 
  Object.values(collections).forEach(col => {
    output[col.id] = {
      name: col.name,
      modes: col.modes,
      tokens: {}
    };
  });
 
  Object.values(variables).forEach(variable => {
    const colId = variable.variableCollectionId;
    const collection = output[colId];
    if (!collection) return;
 
    const path = variable.name.split("/");
 
    collection.modes.forEach(mode => {
      const rawValue = variable.valuesByMode?.[mode.modeId];
      if (!rawValue) return;
 
      if (!collection.tokens[mode.name]) {
        collection.tokens[mode.name] = {};
      }
 
      let current = collection.tokens[mode.name];
 
      path.forEach((key, i) => {
        if (i === path.length - 1) {
          current[key] = {
            $type: variable.resolvedType.toLowerCase(),
            $value: rawValue,
            $extensions: {
              ...variable
            }
          };
        } else {
          current[key] = current[key] || {};
          current = current[key];
        }
      });
    });
  });
 
  return output;
}
 
async function saveFiles(grouped) {
  await fs.ensureDir(OUTPUT_DIR);
  await fs.emptyDir(OUTPUT_DIR);
 
  const combined = [];
 
  Object.values(grouped).forEach(collection => {
    Object.entries(collection.tokens).forEach(([modeName, tokens]) => {
      const outputJSON = {
        ...tokens,
        $extensions: {
          "com.figma.modeName": modeName,
          "com.figma.collectionName": collection.name
        }
      };
 
      const fileName = sanitize(`${collection.name}-${modeName}`);
 
      fs.writeJsonSync(
        `${OUTPUT_DIR}/${fileName}.tokens.json`,
        outputJSON,
        { spaces: 2 }
      );
 
      combined.push(outputJSON);
    });
  });
 
  await fs.writeJson(`${OUTPUT_DIR}/GEN_ALL.tokens.json`, combined, {
    spaces: 2
  });
}
 
async function main() {
  const data = await fetchVariables();
  const grouped = groupByCollection(data);
  await saveFiles(grouped);
}
 
main();
 
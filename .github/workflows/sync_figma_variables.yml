name: Sync Figma Variables
 
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
 
permissions:
  contents: write
 
jobs:
  sync:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20 
 
      - run: npm install axios fs-extra
 
      - run: node scripts/fetch-figma-variables.js
        env:
          FIGMA_API_TOKEN: ${{ secrets.FIGMA_API_TOKEN }}
          FIGMA_FILE_ID: ${{ secrets.FIGMA_FILE_ID }}
 
      - run: |
          git config user.name "figma-bot"
          git config user.email "figma-bot@users.noreply.github.com"
 
          git add tokens/
          git commit -m "update figma tokens" || echo "No changes"
          git push  